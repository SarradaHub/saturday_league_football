version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10

# Notes:
# - Dependabot focuses on small, incremental upgrades for Ruby gems and GitHub Actions.
# - The `.github/workflows/dependency-update.yml` workflow runs weekly to group broader
#   dependency updates into a single PR, complementing Dependabot's daily checks.
